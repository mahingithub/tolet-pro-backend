# =============================================================
#  Render Blueprint — TO-LET PRO backend (Express + Socket.IO)
#  Place this file at the ROOT of the tolet-pro-backend repo.
#  Render auto-detects it and offers "Deploy Blueprint".
#  Spec: https://render.com/docs/blueprint-spec
# =============================================================
services:
  - type: web
    name: toletpro-backend
    runtime: node
    # Starter, not free: a free instance sleeps after 15 minutes of no traffic
    # and takes ~50s to wake, which looks exactly like the site being down.
    plan: starter
    # Singapore, and it MUST match the MongoDB Atlas region (currently
    # AWS / ap-southeast-1) and the Key Value instance. This is not a
    # preference — Render's private network is per-region, so a Key Value
    # instance in another region is unreachable (ENOTFOUND), and an Atlas
    # cluster in another region puts a ~300ms Pacific crossing on every query.
    # Both of those were live production faults before 2026-09-06.
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz   # server.js already exposes this endpoint
    autoDeploy: true            # redeploy on every push to `branch`

    envVars:
      - key: COOKIE_SAMESITE
        value: none

      # Cache + rate limiter + Socket.IO adapter. MUST be the INTERNAL URL of a
      # Key Value instance in THIS SERVICE'S REGION — see the region note above.
      # Left as sync:false rather than wired with fromService because the
      # instance predates this blueprint; paste the Internal Key Value URL.
      #
      # Optional: with no REDIS_URL the app runs uncached (config/redis.js
      # degrades gracefully). /healthz reports `redis` plus, when it cannot
      # connect, a `redisDiagnostic` block naming the cause.
      - key: REDIS_URL
        sync: false
      - key: NODE_ENV
        value: production

      # Auto-generated by Render: a base64 256-bit value (44 chars),
      # which satisfies the ">= 32 chars" check in config/env.js.
      # Generated ONCE and kept stable across deploys — you never see
      # or manage it. (Rotating it would log all users out.)
      - key: JWT_SECRET
        generateValue: true

      # The values below are NOT stored in git. With `sync: false`,
      # Render PROMPTS you for each one in the dashboard when you
      # first create the Blueprint.
      - key: MONGO_URI
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false

      # ── AI ledger/form scanner (controllers/aiScanController.js) ────────────
      # Currently on Vertex AI so the scans bill against the Google Cloud $300
      # credit instead of a metered AI Studio key. Paste the base64 of the
      # service-account JSON — `base64 -i your-key.json` — NEVER the file
      # itself; there is no key file in this repo by design.
      - key: VERTEX_SERVICE_ACCOUNT_BASE64
        sync: false
      # Optional overrides; controller defaults are to-let-pro-14e09 /
      # us-central1 / gemini-2.5-flash.
      #   VERTEX_PROJECT_ID   VERTEX_LOCATION   VERTEX_MODEL
      #
      # Keep GEMINI_API_KEY set too: it is the fallback the moment the credit
      # runs out and the toggle at the top of aiScanController.js flips back.
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Set AFTER your frontend is live on Vercel. Comma-separate
      # multiple origins, no trailing slash. Example:
      #   https://tolet-pro.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # Origin(s) of the SEPARATE admin console subdomain. Comma-separate,
      # no trailing slash. Example:
      #   https://admin.tolet-pro.com
      - key: ADMIN_CORS_ORIGINS
        sync: false

      # Admin token lifetime (short by design). Optional — defaults to 12h.
      - key: JWT_ADMIN_EXPIRES_IN
        value: 12h

      # ── Facebook Page auto-post + token auto-refresh ────────────────────
      # APP_ID + APP_SECRET authenticate the Graph API token-refresh call and
      # are REQUIRED to enable the ~50-day auto-refresh job. PAGE_ID is the
      # numeric Page you post to. PAGE_ACCESS_TOKEN is the SEED long-lived
      # token — used only to bootstrap the DB row the first time; the job then
      # keeps a fresh token in Mongo. All prompted (sync:false) and safe to
      # leave blank — the feature stays dormant until they're set.
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false

      # Optional tuning knobs (sensible defaults in config/env.js):
      #   FACEBOOK_TOKEN_TYPE                 'page' (default) | 'user'
      #   FACEBOOK_TOKEN_REFRESH_BEFORE_DAYS  refresh this many days before
      #                                       expiry (default 10)
      #   FACEBOOK_TOKEN_REFRESH_CRON         check schedule (default '30 3 * * *')
      - key: FACEBOOK_TOKEN_REFRESH_BEFORE_DAYS
        value: "10"
